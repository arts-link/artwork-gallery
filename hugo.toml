# Defaults for the artwork-gallery component. Sites override any of these
# under [params.artworkGallery] in their own configuration.
[params.artworkGallery]
  section = "gallery"        # section holding one folder per piece
  batchSize = 24             # tiles in the HTML; the rest load while scrolling
  artform = "Artwork"
  untitled = "Untitled"
  grid = "square"            # or "justified": rows that keep each image's shape
  collectionTaxonomies = []  # taxonomies whose terms are series, e.g. ["collage", "sculpture"]
  thumbWidths = [320, 640]                # grid tiles and cards (justified grids use 1.5x)
  largeWidths = [800, 1200, 1600, 2400]   # piece images; never wider than the source
  maxWidth = 2400                         # the widest piece image, whatever the photo's size

[module]
  [module.hugoVersion]
    extended = true
    min = "0.163.0"
