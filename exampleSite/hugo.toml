# Example site for the artwork-gallery component. From this folder:
#   hugo server
baseURL = "https://example.org/"
title = "Example artist"
theme = ["artwork-gallery"]
# The component is this repository, two folders up. This only affects the
# example site; it requires the clone to be named artwork-gallery.
themesDir = "../.."
disableKinds = ["rss"]

[taxonomies]
  sculpture = "sculpture"
  collage = "collage"

# Collection taxonomies use the component's layouts.
[[cascade]]
  type = "artworks"
  [cascade.target]
    path = "{/sculpture,/sculpture/**,/collage,/collage/**}"

[params]
  artist = "Example Artist"

[params.artworkGallery]
  section = "gallery"
  artform = "Artwork"
  batchSize = 4
  collectionTaxonomies = ["sculpture", "collage"]

# Encoder settings for the component's image derivatives (Hugo 0.163+).
[imaging]
  resampleFilter = "CatmullRom"
[imaging.avif]
  quality = 55
[imaging.webp]
  quality = 80
[imaging.jpeg]
  quality = 82
